# Nginx Virtual Host Configuration for SentryVault Frontend (Debian VM)
# Place in /etc/nginx/sites-available/sentryvault on your Debian VM

server {
    listen 80;
    server_name _;

    # Root folder for built React production static files
    root /var/www/sentryvault/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # React Single Page App Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to Ubuntu Backend VM
    # Replace 192.168.10.20 with your Ubuntu Backend VM IP
    location /api/v1/ {
        proxy_pass http://192.168.10.20:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
