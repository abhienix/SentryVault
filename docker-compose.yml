version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: securebank_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_securebank_password
      MYSQL_DATABASE: securebank_db
      MYSQL_USER: securebank_user
      MYSQL_PASSWORD: securebank_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - securebank-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_securebank_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securebank_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://securebank_user:securebank_password@db:3306/securebank_db
      - SECRET_KEY=prod-super-secret-key-securebank-2026-change-in-prod-998877
      - DEMO_MODE=true
      - LOG_FILE_PATH=/app/logs/application.log
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - securebank-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securebank_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - securebank-network

volumes:
  mysql_data:
  app_logs:
    driver: local

networks:
  securebank-network:
    driver: bridge
